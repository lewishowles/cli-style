name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check tag matches package versions
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          tag_version="${TAG_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"

          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Release tag '$TAG_NAME' has version '$tag_version', but package.json declares '$package_version'. Create a v$package_version tag before publishing."
            exit 1
          fi

          # The Python package publishes from the same tag, so its version must match too.
          # This reads the version line from the [project] table of pyproject.toml.
          pyproject_version="$(awk -F '"' '
            /^\[project\]$/ { in_project = 1; next }
            /^\[/ { in_project = 0 }
            in_project && /^version = "/ { print $2; exit }
          ' adapters/python/pyproject.toml)"

          if [[ "$tag_version" != "$pyproject_version" ]]; then
            echo "Release tag '$TAG_NAME' matches package.json, but adapters/python/pyproject.toml declares '$pyproject_version'. Set its version to '$tag_version' and tag the updated commit before publishing."
            exit 1
          fi

      - name: Run tests
        run: bun run test:unit

  publish-npm:
    name: Publish npm package
    needs: test
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish to npm
        run: npm publish --access public

  create-release:
    name: Create GitHub release
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Create or reuse release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --title "$TAG_NAME" --generate-notes
          fi

  release-binaries:
    name: Release binary tarballs
    needs:
      - test
      - create-release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - platform: darwin
            architecture: arm64
          - platform: darwin
            architecture: x64
          - platform: linux
            architecture: arm64
          - platform: linux
            architecture: x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Package binary
        env:
          CLI_STYLE_PLATFORM: ${{ matrix.platform }}
          CLI_STYLE_ARCH: ${{ matrix.architecture }}
        run: bun run package:binary

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release upload "$TAG_NAME" dist/release/*.tar.gz --clobber

  publish-pypi:
    name: Publish Python package
    needs:
      - test
      - publish-npm
      - create-release
      - release-binaries
    runs-on: ubuntu-latest

    environment: pypi

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check adapters
        run: bun run check:adapters

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build Python package
        working-directory: adapters/python
        run: |
          python -m pip install build
          python -m build

      - name: Publish Python package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: adapters/python/dist/
